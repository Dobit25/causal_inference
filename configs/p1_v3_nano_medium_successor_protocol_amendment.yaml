  reasoning_effort: medium
  temperature: omitted
  max_output_tokens: 8192
  service_tier: default
  store: false
  structured_outputs: true
  predecessor_model: gpt-5.4-mini-2026-03-17
  predecessor_role: historical_comparator_only
  additional_model_matrix: forbidden
semantic_contract:
