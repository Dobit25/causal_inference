  story_variants:
    certification: [full, partial]
    diagnostics: [ambiguous, nonedge]
  six_vote_rules_unchanged: true
  invalid_pair_action: abstain_pair_only
statistical_framework:
  primary_parent: ensemble_3_of_5
  members: [Single-BOSS, Bootstrap-BOSS, PC, MMPC, FGES]
  ensemble_rule: majority_at_least_3_of_5
  bootstrap_method_level_rule: adjacency_stability_gte_0.80
  bootstrap_sensitivity_conditions: [C1, C2, C3, C4, C5, C6]
  shared_semantic_pool: true
  condition_specific_closure: true
  false_adjacency_orientation_counts_as_error: true
  no_statistical_rerun_before_calibration: true
certification_and_inference:
  independent_unit: scene
  confidence_sequence: mixture_e_process_targeted_confidence_sequence
  optional_stopping_valid: true
  familywise_failure_probability: 0.05
  precision_lcb_target: 0.95
  coverage_scene_mean_floor: 0.20
  graph_validity_required: 1.0
  certification_policies:
    full_automatic: [VERY_HIGH, HIGH]
    partial_automatic: [VERY_HIGH, HIGH]
  high_guardrail:
    precision_floor: 0.90
    minimum_contributing_scenes: 60
    failure_action: review_only_and_stop_before_validation
  ambiguous:
    role: abstention_diagnostic
    calibration_subset: 120
    validation_subset: 120
    automatic_direction_failure_ceiling: 0.05
  nonedge:
    role: hallucination_diagnostic
    calibration_subset: 80
    validation_subset: 80
cohorts:
  method_development: 30
  semantic_calibration:
    looks: [120, 160, 200, 240, 280, 320, 360, 400, 440]
    maximum: 440
  threshold_validation:
    looks: [160, 200, 240, 280, 320, 360, 400, 440, 480]
    maximum: 480
  final_holdout: 80
stage_order:
  - nano_protocol_amendment_freeze
  - exact_identity_plan_and_generator_conformance
  - fresh_spend_and_calibration_authorization
  - sequential_semantic_calibration
  - certified_policy_freeze
  - sequential_threshold_validation
  - paired_scene_clustered_analysis
  - holdout_go_no_go
claim_boundary:
  supported_now: >-
    Nano-medium is a registered, cost-aware primary semantic model for the
    successor framework; Phase F evidence remains development-only.
  not_supported_now:
    - calibration_certification
    - validation_performance
    - holdout_performance
    - real_world_generalization
execution_boundary:
  new_scenes_materialized: 0
  statistical_fits: 0
  semantic_api_calls: 0
  oracle_access: false
  calibration_access: false
  validation_access: false
  holdout_access: false
  live_authorization: false
