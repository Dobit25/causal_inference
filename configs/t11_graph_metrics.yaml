experiment:
  task: T11
  phase: p0_released
  status: frozen_development_evaluator

scope:
  split_manifest: data/manifests/p0_frozen_split.json
  cohort: graph
  role: dev
  expected_scenes: 8
  expected_conditions_per_scene: 5
  expected_records: 40
  forbid_holdout_access: true
  allow_builder_tuning: false
  allow_llm_calls: false
  allow_tasks_or_queries: false

inputs:
  llm_dag: data/manifests/t08_dev_graphs.jsonl
  scd_raw_cpdag: data/manifests/t09_dev_scd_cpdag.jsonl
  scd_projected_dag: data/manifests/t09_dev_scd_projected_dag.jsonl
  hybrid_dag: data/manifests/t10_dev_hybrid_graphs.jsonl
  oracle_loader_config: configs/t07_oracle_loader.yaml
  oracle_access: grading_only_in_memory
  persist_oracle_edges: false

conditions:
  - {id: G_LLM, input: llm_dag, role: primary}
  - {id: G_SCD_RAW, input: scd_raw_cpdag, role: primary}
  - {id: G_SCD_PROJECTED, input: scd_projected_dag, role: sensitivity}
  - {id: G_HYBRID, input: hybrid_dag, role: primary}
  - {id: G_ORACLE, input: oracle, role: sanity}

conventions:
  metric_schema_version: fourgraph.graph_metric_record.v1
  metrics_input: GraphArtifact.metrics_view
  floating_precision_decimals: 8
  precision_empty_prediction: 1_if_truth_also_empty_else_0
  recall_empty_truth: 1
  skeleton_shd: false_positive_plus_false_negative
  dag_shd: unordered_pair_state_mismatch_reversal_cost_1
  cpdag_state_shd: unordered_pair_absent_undirected_forward_reverse_mismatch
  normalization: divide_by_n_choose_2
  macro_unit: scene
  inferential_statistics: deferred_to_t15

metric_families:
  common: [skeleton_precision, skeleton_recall, skeleton_f1, adjacency_fp, adjacency_fn, skeleton_shd, validity, node_consistency]
  raw_cpdag: [compelled_correct, compelled_incorrect, compelled_missed, compelled_precision, compelled_recall, unresolved_rate, cpdag_state_shd]
  dag: [directed_precision, directed_recall, directed_f1, orientation_accuracy_on_common_adjacencies, shd_reversal_cost_one, normalized_shd]
  hybrid_attribution: [inherited_skeleton_error, inherited_compelled_error, semantic_orientation_correctness, projected_orientation_correctness, semantic_projection_disagreement]

functional_metrics:
  sid:
    status: unavailable
    reason: no_pinned_validated_implementation
    raw_cpdag_policy: never_silently_project
  aid:
    status: unavailable
    reason: no_pinned_validated_implementation
    raw_cpdag_policy: never_silently_project
  unavailable_is_not_zero: true

outputs:
  records: data/manifests/t11_dev_graph_metrics.jsonl
  audit: data/manifests/t11_graph_metrics_audit.json

