schema_version: fourgraph.p1_t21_amendment_v2_development.v1
experiment_id: causalds_fresh_hybrid_p1_v1
task: T21
status: amendment_v2_development_execution_authorized

scope:
  split_manifest: data/manifests/t18_p1_frozen_split.json
  role: development
  expected_scenes: 20
  expected_holdout_scenes: 80
  forbid_holdout_access: true
  generated_root: data/generated/p1_hybrid_v1

execution:
  scd_scenes: 20
  direct_lingam_scenes: 20
  semantic_preference_calls: 60
  standalone_llm_calls: 20
  reused_standalone_full_calls: 20
  maximum_new_api_calls: 80
  expected_new_api_calls: 60
  resume_from_raw_cache: true
  validation_retries: 2
  failure_policy: retain_terminal_failure_without_fallback
  automatic_holdout_continuation: false

scd:
  algorithm: BOSS
  score: BasisFunctionBicScore
  candidate_id: boss_basis_bic__p1__t3
  penalty_discount: 1.0
  truncation_limit: 3
  standardized_observations: observations_standardized_n2000.npy
  tetrad_jar: data/raw/t05/py-tetrad/pytetrad/resources/tetrad-current.jar
  tetrad_jar_sha256: 5A3BA56ADECE35DA8A209B39DB8B8BF29D4037FB79ED56C4B63F8D3B4C1A7051

direct_lingam:
  package: lingam
  version: 1.13.0
  random_state: 17021
  adjacency_zero_tolerance: 1.0e-12
  role: structural_sensitivity_only

semantic_backend:
  provider: openai
  model_snapshot: gpt-5.4-nano-2026-03-17
  endpoint: /v1/responses
  sdk_version: 3.6.0
  credential_env: OPENAI_API_KEY
  reasoning_effort: none
  temperature: 0
  max_output_tokens: 6000
  service_tier: default
  store: false
  structured_outputs: json_schema_strict
  transport_max_retries: 2
  timeout_seconds: 120
  preference_prompt: prompts/p1_semantic_preferences_v2.md
  preference_schema: schemas/p1_semantic_preferences_response_v1.schema.json
  llm_graph_prompt: prompts/p1_llm_graph_v1.md
  llm_graph_schema: schemas/p1_llm_graph_response_v1.schema.json
  public_names_only: true
  canonical_mapping_after_response_only: true
  one_preference_call_per_scene_variant: true

hybrid:
  preference_variants: [full, partial, ambiguous]
  reuse_one_preference_artifact_across_H1_H2: true
  H1:
    variant: full
    independent_argmax: true
    global_repair: false
    invalid_output: terminal_graph_failure
  H2_FORCED:
    implementation: fourgraph.hybrid_h2.solve_h2_forced
  H2_SELECTIVE:
    implementation: fourgraph.hybrid_h2.solve_h2_selective

threshold_selection:
  oracle_scope: development_only
  variants_equal_weight: [full, partial, ambiguous]
  grid:
    tau_margin: [0.0, 0.02, 0.05, 0.1, 0.2]
    tau_conflict: [0.0, 0.05, 0.1, 0.2]
  eligibility:
    graph_validity: 1.0
    orientation_precision_minimum: 0.95
  optimize: maximum_orientation_coverage
  tie_breakers: [minimum_confident_wrong_rate, lower_tau_margin, higher_tau_conflict]
  forbidden_inputs: [holdout_graph_truth, holdout_tasks_or_answers, reasoner_downstream_ranking, standalone_llm_comparator_results]
  no_eligible_action: stop_pre_holdout_and_amend_protocol

outputs:
  raw_calls: results/raw/p1_t21_v2_development/openai_calls_recovered.jsonl
  runtime: results/raw/p1_t21_v2_development/runtime.jsonl
  semantic_preferences: data/manifests/t21_v2_dev_semantic_preferences.jsonl
  graphs: data/manifests/t21_v2_dev_graphs.jsonl
  structural_metrics: data/manifests/t21_v2_dev_structural_metrics.jsonl
  threshold_grid: data/manifests/t21_v2_threshold_grid.jsonl
  audit: data/manifests/t21_v2_development_audit.json
  report: reports/t21_v2_p1_development.md

budget:
  rendered_prompt_forecast_required: true
  user_authorized_on: 2026-09-16
  user_authorized_maximum_new_calls: 100
  usd_stop_not_automatically_observable: true

evidence_boundary:
  P1_development_access_authorized: true
  P1_holdout_access_authorized: false
  development_oracle_for_threshold_and_metrics: true
  development_tasks_or_answers_allowed_for_threshold: false
  reasoner_execution_authorized: false
  P1_holdout_execution_authorized: false

runtime:
  python: 3.10.21
  numpy: 1.26.4
  jpype: 1.6.0
  openai: 3.6.0
  lingam: 1.13.0
  scipy: 1.13.1
  scikit_learn: 1.7.2

