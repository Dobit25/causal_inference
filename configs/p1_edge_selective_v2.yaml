schema_version: fourgraph.p1_edge_selective_protocol.v2

experiment:
  id: causalds_fresh_hybrid_p1_edge_selective_v2
  task: T21_AMENDMENT_V3A
  phase: P1_v2
  status: design_frozen_pre_implementation
  parent_experiment: causalds_fresh_hybrid_p1_v1
  parent_terminal_result: T21_v2_threshold_gate_failed

research_question: >
  Can a globally consistent edge-selective semantic orientation method add only
  well-supported directions to a BOSS CPDAG, preserve unresolved uncertainty,
  achieve at least 0.95 end-to-end orientation precision with useful coverage,
  and improve downstream causal analysis without modifying the statistical
  skeleton or compelled directions?

claim_boundary:
  primary: edge_selective_orientation_safety_and_coverage
  method_name: G_HYBRID_H2_EDGE_SELECTIVE
  allowed_claims:
    - selective_orientation_precision_and_coverage
    - graph_validity_and_abstention
    - downstream_value_after_validation_gate
  forbidden_claims:
    - skeleton_correction
    - compelled_direction_correction
    - universal_causal_discovery_superiority
    - holdout_effectiveness_before_one_time_evaluation

parent_graph:
  source: G_SCD_RAW
  algorithm: BOSS
  score: BasisFunctionBicScore
  graph_type: cpdag
  mutable_edge_class: undirected_only
  preserve_nodes: true
  preserve_skeleton: true
  preserve_compelled_directions: true
  add_edges: false
  delete_edges: false
  reverse_compelled_edges: false

semantic_signal:
  provider: openai
  model_snapshot: gpt-5.4-nano-2026-03-17
  prompt: prompts/p1_semantic_preferences_v2.md
  response_schema: schemas/p1_semantic_preferences_response_v1.schema.json
  story_variants: [full, partial, ambiguous]
  probability_bounds: [0.001, 0.999]
  semantic_confidence_formula: max_p_one_minus_p
  semantic_confidence_definition: max(p_left_causes_right, 1 - p_left_causes_right)
  provider_probability_is_not_assumed_calibrated: true
  live_calls_authorized_at_v3a: false

credible_extension_consensus:
  extension_universe: all_consistent_dag_extensions_of_parent_cpdag
  enumeration: exact
  dag_score:
    name: summed_log_bernoulli_direction_likelihood
    formula: sum_over_parent_undirected_edges_log_probability_of_direction_in_extension
    probability_clipping: none_beyond_response_contract
  normalization:
    method: stable_softmax_over_all_extension_scores
    temperature: 1.0
    temperature_tuning_allowed: false
  global_stability:
    formula: normalized_weight_mass_of_extensions_containing_candidate_direction
    range: [0.5, 1.0]
  candidate_rule: semantic_confidence_gte_tau_semantic_and_global_stability_gte_tau_global
  joint_selection:
    method: exact_globally_compatible_subset
    feasibility: selected_directions_cooccur_in_at_least_one_consistent_extension
    objective_order:
      - maximum_sum_global_stability
      - maximum_selected_edge_count
      - maximum_sum_semantic_confidence
      - lexicographic_canonical_direction_list
    greedy_order_dependence_allowed: false

partial_graph_output:
  representation: maximally_oriented_pdag_with_background_knowledge
  graph_contract_extension_required_at_v3b: true
  closure:
    method: meek_rules_R1_R2_R3_R4
    execution: deterministic_fixed_point
    rule_order: [R1, R2, R3, R4]
    within_rule_edge_order: lexicographic
  invariants:
    - no_directed_cycle
    - parent_node_universe_unchanged
    - parent_skeleton_unchanged
    - parent_compelled_directions_preserved
    - no_new_unshielded_collider_outside_parent_equivalence_class_or_selected_background_knowledge
    - at_least_one_consistent_dag_extension_exists
  direction_sources:
    - compelled
    - semantic_selected
    - closure_propagated
    - unresolved
  provenance_required_per_edge: true

threshold_selection:
  candidates: 20
  grid:
    semantic_confidence: [0.80, 0.90, 0.95, 0.99, 0.999]
    global_stability: [0.80, 0.90, 0.95, 1.00]
  selection_data: new_validation_20_only
  development_data_role: method_engineering_only
  downstream_results_allowed_for_selection: false
  gate:
    graph_validity: 1.0
    end_to_end_selective_orientation_precision_minimum: 0.95
    minimum_answered_edges: 20
    minimum_orientation_coverage: 0.20
  optimize: maximum_orientation_coverage
  tie_breakers:
    - higher_end_to_end_precision
    - fewer_oriented_false_adjacencies
    - higher_global_stability_threshold
    - higher_semantic_confidence_threshold
  no_eligible_action: stop_p1_v2_without_holdout_access

metric_contract:
  answered_direction_definition:
    include: [semantic_selected, closure_propagated]
    exclude: [parent_compelled, unresolved]
  primary_precision:
    numerator: answered_directions_matching_oracle_dag
    denominator: all_answered_directions_including_oriented_false_adjacencies
    false_adjacency_orientation: incorrect
  direct_semantic_precision_reported_separately: true
  closure_propagated_precision_reported_separately: true
  coverage:
    numerator: parent_undirected_edges_newly_oriented
    denominator: all_parent_undirected_edges_including_false_adjacencies
  structural_metrics:
    - skeleton_precision_recall_f1
    - false_positive_and_false_negative_adjacencies
    - selective_orientation_precision
    - orientation_coverage
    - abstention_rate
    - risk_coverage_curve
    - graph_validity
  calibration_diagnostics:
    - brier_score
    - expected_calibration_error
    - accuracy_by_confidence_bin
    - high_confidence_false_adjacency_orientation_rate
  downstream_metrics_after_gate_only:
    - official_adjustment_control_accuracy
    - uncertainty_aware_correctness
    - uniquely_identified_query_rate
    - undetermined_rate
    - failure_rate
  independent_unit: scene_id

cohorts:
  method_development:
    source: data/manifests/t18_p1_frozen_split.json
    role: existing_20_development_scenes
    method_results_already_observed: true
    threshold_selection_allowed: false
  threshold_validation:
    role: new_unseen_validation_scenes
    count: 20
    study_id_namespace: P1V000-P1V019
    graph_scene_id_namespace: scene_110000-scene_110019
    master_seed: 21301
    generator_family: same_frozen_T18_linear_non_gaussian_generator
    nodes: [5, 6, 7]
    node_count_allocation: [7, 7, 6]
    primary_motif_allocation:
      chain: 4
      fork: 4
      collider: 4
      mediator: 4
      diamond: 4
    noise_family_allocation:
      laplace: 7
      logistic: 7
      student_t_5: 6
    observed_nodes_only: true
    minimum_oracle_cpdag_unresolved_edges: 2
    observations_per_scene: 2000
    story_variants: [full, partial, ambiguous]
    tasks_per_scene: 5
    query_strata_allocation:
      valid_empty: 5
      one_nonempty_minimal: 5
      multiple_minimal: 5
      no_valid_adjustment: 5
    generated_at_v3a: false
    method_executed_at_v3a: false
  final_holdout:
    source: existing_T18_holdout_80
    count: 80
    exact_ids_unchanged: true
    accessed_at_v3a: false
    access_authorized: false

comparators:
  ids:
    - G_SCD_RAW
    - G_SCD_PROJECTED
    - G_HYBRID_H2_FORCED
    - G_HYBRID_H2_SCENE_SELECTIVE
    - G_HYBRID_H2_EDGE_SELECTIVE
    - G_LLM_MATCHED_EVIDENCE
    - G_ORACLE_CPDAG_DIAGNOSTIC
  roles:
    G_ORACLE_CPDAG_DIAGNOSTIC: development_and_validation_only_non_primary
    all_comparators_forbidden_from_threshold_selection: true

stage_plan:
  T21_V3A: protocol_freeze_only
  T21_V3B: offline_implementation_contract_and_synthetic_conformance
  T21_V3C: generate_and_freeze_new_20_validation_scenes
  T21_V3D: validation_semantic_calls_and_twenty_candidate_gate
  T21_V3E: terminal_gate_and_holdout_freeze_decision
  T22: freeze_exact_existing_80_holdout_execution_if_and_only_if_v3e_passes

access_and_freeze:
  v3a_api_calls: 0
  v3a_validation_scenes_generated: 0
  v3a_edge_selective_implemented: false
  v3a_existing_development_method_results_reanalyzed: false
  v3a_holdout_scene_artifacts_accessed: 0
  v3a_holdout_method_results_accessed: 0
  P1_holdout_execution_authorized: false
  next_authorized_action: T21_V3B_OFFLINE_IMPLEMENTATION_AND_SYNTHETIC_CONFORMANCE
  amendment_policy: any_change_after_freeze_requires_new_protocol_version_and_new_validation_cohort

dependencies:
  - configs/p1_hybrid_v1.yaml
  - data/manifests/t17_p1_hybrid_protocol_freeze.json
  - configs/t18_p1_generation.yaml
  - data/manifests/t18_p1_generation_audit.json
  - data/manifests/t18_p1_frozen_split.json
  - configs/t19_p1_semantic_stories.yaml
  - data/manifests/t19_p1_story_audit.json
  - data/manifests/t20_h2_conformance_audit.json
  - configs/t21_p1_development.yaml
  - data/manifests/t21_development_audit.json
  - configs/t21_v2_semantic_conformance.yaml
  - data/manifests/t21_v2_semantic_conformance_live_audit.json
  - configs/t21_v2_p1_development.yaml
  - data/manifests/t21_v2_development_audit.json
  - configs/t21_v2_comparators.yaml
  - data/manifests/t21_v2_comparator_audit.json
  - prompts/p1_semantic_preferences_v2.md
  - schemas/p1_semantic_preferences_response_v1.schema.json
  - schemas/graph_contract_v1.schema.json
  - src/fourgraph/hybrid_h2.py
