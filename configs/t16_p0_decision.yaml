supported_claims:
  - Semantic orientation substantially improves direction recovery over deterministic CPDAG projection on the successful H1 graphs.
  - Semantic orientation substantially improves official downstream adjustment/control accuracy over deterministic projection.
  - Standalone LLM and H1 Hybrid downstream accuracy are not distinguishable at the registered scene-level analysis resolution.
  - Conservative CPDAG scoring measures graph-conditioned reasoning under uncertainty and must not be interpreted as ground-truth graph accuracy.
  - Correct graph structure does not guarantee perfect downstream answers because residual reasoner error remains under G_ORACLE.

unsupported_claims:
  - H1 Hybrid is the best graph construction method.
  - H1 Hybrid outperforms the standalone LLM graph downstream.
  - Preserving CPDAG uncertainty always outperforms producing a DAG.
  - Released CausalDS P0 results generalize to homogeneous SCMs, larger graphs, latent confounding, or real deployments.
  - The two H1 failures may be selectively repaired or rerun as part of the P0 estimand.

decision_rationale:
  go_rejected_because:
    - H1 has two terminal graph failures among 25 holdout scenes.
    - H1 does not significantly outperform G_LLM downstream.
    - The old DirectLiNGAM-only P1 would not directly test CPDAG semantic orientation and abstention.
  stop_rejected_because:
    - H1 strongly outperforms deterministic projection in direction and official downstream accuracy.
    - The observed global-consistency failures identify a concrete method-development target.
  refine_selected_because:
    - Fresh homogeneous SCMs are required for stronger external validity and controlled assumptions.
    - P1 should evaluate global constraint-aware semantic orientation and evidence-aware abstention.

next_phase:
  authorized_action: T17_P1_HYBRID_PROTOCOL_DESIGN
