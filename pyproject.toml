[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourgraph"
version = "0.1.0"
description = "Controlled four-graph experiments for causal reasoning"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "JPype1>=1.6,<2",
  "numpy>=1.26,<2",
  "pyarrow>=15,<24",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
live = [
  "google-genai==2.21.0",
  "openai==3.6.0",
  "python-dotenv==1.2.3",
]

[project.scripts]
fourgraph = "fourgraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
